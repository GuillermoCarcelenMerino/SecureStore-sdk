name: CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: gradle
        uses: gradle/actions/setup-gradle@v5

      - name: build,test,lint
        run: ./gradlew :securestore:assembleRelease :app:assembleRelease lintRelease testDebugUnitTest koverVerifyDebug
